<!DOCTYPE html>
<!-- AppleUX logo asset source: same SVG artwork as appleux-boot.html,
     isolated on transparency for PNG capture (?w=<px>&alpha=1).
     Captured by tools/extract-boot-assets.py into res/drawable-nodpi. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AppleUX Logo Asset</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #000; }
  body.alpha, body.alpha .stage { background: transparent; }
  .stage { width: 100vw; height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #000; }
  .logo { overflow: visible; }
  .logo * { transform-box: fill-box; }
</style>
</head>
<body>
<div class="stage">
  <svg class="logo" id="logo" viewBox="1.5 -1.2 22.4 25.6" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AppleUX logo">
    <defs>
      <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#e4e4ea"/><stop offset="1" stop-color="#b9b9c2"/></linearGradient>
      <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cf0b0"/><stop offset="1" stop-color="#3ddc84"/></linearGradient>
      <linearGradient id="sh"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <clipPath id="clip"><use href="#body"/></clipPath>
    </defs>
    <path id="body" fill="url(#silver)" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09z"/>
    <g clip-path="url(#clip)"><rect x="8" y="0" width="6" height="26" fill="url(#sh)"/></g>
    <path fill="url(#silver)" d="M15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
    <text x="11.5" y="16.5" text-anchor="middle" font-size="6" font-weight="500" fill="#3ddc84" fill-opacity=".88" style="font-family:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;letter-spacing:-.2px">16</text>
    <g>
      <path d="M19.9 11.9 L19.3 10.7" fill="none" stroke="url(#green)" stroke-width=".3" stroke-linecap="round"/>
      <path d="M21.5 11.9 L22.1 10.7" fill="none" stroke="url(#green)" stroke-width=".3" stroke-linecap="round"/>
      <path fill="url(#green)" d="M19 13.6 A1.7 1.7 0 0 1 22.4 13.6 Z"/>
      <circle cx="20.1" cy="12.95" r=".26" fill="#04210f"/>
      <circle cx="21.3" cy="12.95" r=".26" fill="#04210f"/>
    </g>
  </svg>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  // Logo box keeps the boot screen's 170x204 proportion, scaled to ?w= px.
  const w = Math.max(16, parseInt(q.get("w") || "512", 10));
  const logo = document.getElementById("logo");
  logo.style.width = w + "px";
  logo.style.height = Math.round(w * 204 / 170) + "px";
  if (q.has("alpha")) document.body.classList.add("alpha");
})();
</script>
</body>
</html>
