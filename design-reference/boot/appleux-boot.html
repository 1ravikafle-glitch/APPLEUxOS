<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AppleUX OS Boot</title>
<style>
:root {
  --bg: #000; --fg: #f5f5f7; --muted: #86868b; --green: #3ddc84;
  --sketch-time: 1.2s; --sketch-width: .22; --sketch-color: #bff7d8; --fill-delay: .5s;
  --wave-time: 2.8s; --wave-gap: .18s; --glow-time: 3.4s;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; --fg: #f5f5f7; } }
:root[data-theme="dark"] { --bg: #000; --fg: #f5f5f7; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }

.boot { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
  background:
    radial-gradient(60% 40% at 100% 0%, rgba(61,220,132,.14), transparent 70%),
    radial-gradient(60% 40% at 0% 100%, rgba(90,110,255,.12), transparent 70%),
    radial-gradient(ellipse at 50% 42%, rgba(70,70,90,.22), transparent 60%), var(--bg); }

/* iOS-style liquid glass */
.glass { background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.45);
  -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%); }

.controls { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; display: flex; gap: 8px; z-index: 3; }
.control { font: inherit; font-size: 12px; color: #fff; padding: 9px 15px; border-radius: 999px; cursor: pointer; transition: transform .2s, filter .2s; }
.control:hover { filter: brightness(1.25); }
.control:active { transform: scale(.96); }
.control:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
/* Frame-capture mode (?bare): hide interactive controls for bootanimation frames. */
body.bare .controls { display: none; }

/* Apple glow: sits behind the logo, fades on and off */
.halo { position: absolute; inset: -70px; border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.34), rgba(255,255,255,.1) 45%, transparent 70%); }
.logo-wrap { position: relative; width: 170px; height: 204px; margin-bottom: 24px; }
.logo { position: relative; width: 100%; height: 100%; overflow: visible; }
.logo * { transform-box: fill-box; }

.trace { fill: none; stroke: var(--sketch-color); stroke-width: var(--sketch-width); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
.fill, .leaf, .num, .droid, .brand, .progress { opacity: 0; }
.sheen { opacity: .9; transform: translateX(0) skewX(-18deg); }
.ring { fill: none; stroke: var(--green); stroke-width: .1; opacity: 0; transform-origin: center; }
.ant { transform-origin: 50% 100%; }
.eye { transform-origin: center; }

.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.brand-name { font-size: clamp(30px, 6vw, 40px); font-weight: 600; letter-spacing: 6px; padding-left: 6px; }
.brand-name i { --c: #6e6e76; --peak: #fff; --g: 255,255,255; display: inline-block; font-style: normal; color: var(--c); }
.brand-name i.u { --c: #1f8a4f; --peak: #9cf7c3; --g: 61,220,132; font-weight: 300; }
.tagline { color: var(--muted); font-size: 12px; letter-spacing: 2px; }

.progress { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 13%); width: min(200px, 54vw); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.track { width: 100%; height: 7px; border-radius: 9px; overflow: hidden; padding: 1px; }
.bar { width: 100%; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #fff, #d8fbe8 75%, var(--green)); transform: scaleX(0); transform-origin: left; }
.status { color: var(--muted); font-size: 12px; letter-spacing: 1px; min-height: 16px; }
.version { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); color: #48484d; font-size: 11px; letter-spacing: 1px; transition: opacity .4s; }

/* Intro timeline (restarts when .run is re-added) */
.run .halo { animation: glow var(--glow-time) ease-in-out 2.2s infinite; }
.run .trace { animation: draw var(--sketch-time) cubic-bezier(.4,0,.2,1) forwards, out .6s ease var(--sketch-time) forwards; }
.run .fill { animation: show 1.1s ease var(--fill-delay) forwards; }
.run .sheen { animation: sweep 1.3s ease-in-out 2s both; }
.run .leaf { transform-origin: 15% 95%; animation: grow .9s cubic-bezier(.3,1.4,.4,1) 1s forwards; }
.droid-pos { transform: translate(.6px, 0); }
.run .num { animation: show .8s ease 2.1s forwards; }
.run .droid { transform-origin: 50% 100%; animation: dock 1s cubic-bezier(.2,1.5,.4,1) 2.4s forwards; }
.run .ring { animation: ring 1.1s ease-out 2.95s forwards; }
.run .ant.l { animation: waveL 3.4s ease-in-out 4s infinite; }
.run .ant.r { animation: waveR 3.4s ease-in-out 4.2s infinite; }
.run .eye { animation: blink 5s ease-in-out 4s infinite; }
.run .brand { animation: rise .9s ease 2.6s forwards; }
.run .brand-name i { animation: colorwave var(--wave-time) ease-in-out calc(3.2s + var(--i) * var(--wave-gap)) infinite; }
.run .progress { animation: show .6s ease 2.3s forwards; }
.run .bar { animation: load 5s cubic-bezier(.25,.6,.35,1) 2.3s forwards; }
.ready .progress { animation: out .6s ease forwards !important; }
.ready .version { opacity: 0; }
.ready .logo-wrap { animation: pulse 1s ease; }

@keyframes show { to { opacity: 1; } }
@keyframes out { to { opacity: 0; } }
@keyframes draw { 0% { opacity: 1; stroke-dashoffset: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
@keyframes sweep { 0% { transform: translateX(0) skewX(-18deg); } 100% { transform: translateX(30px) skewX(-18deg); } }
@keyframes grow { from { opacity: 0; transform: scale(.3) rotate(-12deg); } to { opacity: 1; transform: none; } }
@keyframes dock { 0% { opacity: 0; transform: translate(3px,-5px) scale(.25); } 100% { opacity: 1; transform: none; } }
@keyframes ring { 0% { opacity: .9; transform: scale(.5); } 100% { opacity: 0; transform: scale(3.2); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes load { to { transform: scaleX(1); } }
@keyframes pulse { 50% { transform: scale(1.04); } }
@keyframes waveL { 0%, 85%, 100% { transform: rotate(0); } 92% { transform: rotate(-14deg); } }
@keyframes waveR { 0%, 85%, 100% { transform: rotate(0); } 92% { transform: rotate(14deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
/* Letters stay in place; a wave of color and glow travels through them */
@keyframes colorwave {
  0%, 100% { color: var(--c); text-shadow: 0 0 0 rgba(var(--g), 0); }
  50% { color: var(--peak); text-shadow: 0 0 16px rgba(var(--g), .75); }
}
/* Apple glow on / off */
@keyframes glow {
  0%, 100% { opacity: 0; transform: scale(.82); }
  50% { opacity: 1; transform: scale(1.08); }
}

@media (max-height: 520px) { .logo-wrap { width: 100px; height: 120px; margin-bottom: 10px; } .progress { bottom: 46px; } .brand-name { font-size: 26px; } }
@media (prefers-reduced-motion: reduce) { .run * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
<main class="boot" id="boot">

  <div class="controls">
    <button class="control glass" id="soundBtn" type="button">Enable sound</button>
    <button class="control glass" id="replayBtn" type="button">Replay</button>
  </div>

  <div class="logo-wrap">
    <div class="halo"></div>
    <svg class="logo" viewBox="1.5 -1.2 22.4 25.6" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AppleUX logo: an apple with an Android head in its bite">
      <defs>
        <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#e4e4ea"/><stop offset="1" stop-color="#b9b9c2"/></linearGradient>
        <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cf0b0"/><stop offset="1" stop-color="#3ddc84"/></linearGradient>
        <linearGradient id="sh"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <clipPath id="clip"><use href="#body"/></clipPath>
      </defs>

      <path class="trace" id="trace" pathLength="1" d=""/>
      <path class="fill" id="body" fill="url(#silver)" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09z"/>
      <g clip-path="url(#clip)"><rect class="sheen" x="-6" y="0" width="6" height="26" fill="url(#sh)"/></g>

      <path class="leaf" fill="url(#silver)" d="M15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>

      <text class="num" x="11.5" y="16.5" text-anchor="middle" font-size="6" font-weight="500" fill="#3ddc84"" fill-opacity=".88" style="font-family:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;letter-spacing:-.2px">16</text>

      <!-- Android head nested in the apple's bite -->
      <g class="droid-pos">
      <circle class="ring" cx="20.7" cy="13.4" r="1.6"/>
      <g class="droid">
        <path class="ant l" d="M19.9 11.9 L19.3 10.7" fill="none" stroke="url(#green)" stroke-width=".3" stroke-linecap="round"/>
        <path class="ant r" d="M21.5 11.9 L22.1 10.7" fill="none" stroke="url(#green)" stroke-width=".3" stroke-linecap="round"/>
        <path fill="url(#green)" d="M19 13.6 A1.7 1.7 0 0 1 22.4 13.6 Z"/>
        <circle class="eye" cx="20.1" cy="12.95" r=".26" fill="#04210f"/>
        <circle class="eye" cx="21.3" cy="12.95" r=".26" fill="#04210f"/>
      </g>
      </g>
    </svg>
  </div>

  <section class="brand">
    <div class="brand-name" aria-label="AppleUX"><i style="--i:0" aria-hidden="true">A</i><i style="--i:1" aria-hidden="true">p</i><i style="--i:2" aria-hidden="true">p</i><i style="--i:3" aria-hidden="true">l</i><i style="--i:4" aria-hidden="true">e</i><i class="u" style="--i:5" aria-hidden="true">U</i><i class="u" style="--i:6" aria-hidden="true">X</i></div>
    <div class="tagline">Designed to feel different</div>
  </section>

  <section class="progress" aria-live="polite">
    <div class="track glass"><div class="bar"></div></div>
    <div class="status" id="status">Starting system</div>
  </section>

  <div class="version">AppleUX OS concept build</div>
</main>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const boot = $("boot"), status = $("status"), soundBtn = $("soundBtn");
  $("trace").setAttribute("d", $("body").getAttribute("d"));
  // Frame-capture mode (?bare=1): hide interactive controls for bootanimation frames.
  if (/[?&]bare\b/.test(location.search)) document.body.classList.add("bare");

  const START = 2300, LOAD = 5000;
  const stages = [[0,"Starting system"],[20,"Loading core"],[45,"Preparing interface"],[70,"Optimizing system"],[90,"Almost ready"],[100,"Welcome"]];
  let ctx = null, master = null, sound = false, timers = [];

  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function note(f, d, len, v, type) {
    const t = ctx.currentTime + d, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + .06);
    g.gain.exponentialRampToValueAtTime(.0001, t + len);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + len + .05);
  }
  function chime(delay) {
    if (!sound) return;
    [[440,0,.7,.3],[554.37,.18,.9,.24],[659.25,.4,1.1,.2],[880,.68,1.3,.14]].forEach(n => note(n[0], delay + n[1], n[2], n[3]));
    note(220, delay + .7, 1.5, .08, "triangle");
  }

  function run() {
    timers.forEach(clearTimeout); timers = [];
    boot.classList.remove("run", "ready");
    void boot.offsetWidth;
    boot.classList.add("run");
    status.textContent = stages[0][1];
    stages.forEach(s => later(() => status.textContent = s[1], START + s[0] / 100 * LOAD));
    later(() => boot.classList.add("ready"), START + LOAD + 450);
    chime(1.1);
  }

  soundBtn.addEventListener("click", async () => {
    if (!sound) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { status.textContent = "Audio unavailable"; return; }
      if (!ctx) { ctx = new AC(); master = ctx.createGain(); master.gain.value = .6; master.connect(ctx.destination); }
      try { await ctx.resume(); } catch (_) { status.textContent = "Tap again to enable audio"; return; }
      sound = true; soundBtn.textContent = "Sound on"; chime(0);
    } else { sound = false; soundBtn.textContent = "Enable sound"; }
  });
  $("replayBtn").addEventListener("click", run);
  run();
})();
</script>
</body>
</html>
