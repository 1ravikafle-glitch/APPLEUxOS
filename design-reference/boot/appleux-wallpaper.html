<!DOCTYPE html>
<!-- AppleUX wallpaper: boot-screen ambience without the logo.
     Same three radial tints as appleux-boot.html on deep black. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AppleUX Wallpaper</title>
<style>
  * { margin: 0; }
  html, body { width: 1080px; height: 2408px; overflow: hidden; background: #000; }
  .wall { width: 1080px; height: 2408px;
    background:
      radial-gradient(60% 40% at 100% 0%, rgba(61,220,132,.14), transparent 70%),
      radial-gradient(60% 40% at 0% 100%, rgba(90,110,255,.12), transparent 70%),
      radial-gradient(ellipse at 50% 42%, rgba(70,70,90,.22), transparent 60%), #000; }
</style>
</head>
<body><div class="wall"></div></body>
</html>
