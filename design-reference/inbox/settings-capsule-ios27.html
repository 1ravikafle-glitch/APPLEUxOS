<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS 27 Settings — Grouped Capsule Cards — POCO M5</title>
<style>
  :root {
    --w: 402px;
    --h: 896px;
    --system-background: #000000;
    --grouped-bg: #000000;
    --card-bg: #1C1C1E;
    --card-bg-2: #2C2C2E;
    --label: #FFFFFF;
    --secondary-label: rgba(235,235,245,0.60);
    --tertiary-label: rgba(235,235,245,0.30);
    --separator: rgba(84,84,88,0.65);
    --system-blue: #0A84FF;
    --system-green: #30D158;
    --system-red: #FF453A;
    --system-orange: #FF9F0A;
    --system-yellow: #FFD60A;
    --system-pink: #FF375F;
    --system-purple: #BF5AF2;
    --system-teal: #64D2FF;
    --system-indigo: #5E5CE6;
    --system-gray: #8E8E93;
    --system-gray4: #3A3A3C;

    /* Liquid Glass grouped card radius — iOS 27 */
    --card-radius: 26px;
    --card-pad: 6px;

    --notch-w: 218px;
    --notch-h: 34px;
    --notch-r: 20px;

    --font: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0a0f; color: #e8e8ed; font-family: var(--font);
    min-height: 100vh; padding: 24px 16px 64px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .page-info {
    font-size: 12px; color: #8a8a95; text-align: center;
    max-width: 680px; line-height: 1.6;
  }
  .page-info strong { color: #e8e8ed; font-weight: 600; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 10px 14px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
  }
  .controls button {
    font-family: var(--font); font-size: 12px; font-weight: 500;
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06); color: #e8e8ed;
    cursor: pointer; transition: all 0.15s;
  }
  .controls button:hover { background: rgba(255,255,255,0.12); }
  .controls button.active { background: #0A84FF; border-color: #0A84FF; color: #fff; }
  .phone {
    width: calc(var(--w) + 16px); height: calc(var(--h) + 16px);
    background: #1a1a1e; border-radius: 46px; padding: 8px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.7);
    position: relative;
  }
  .screen {
    width: var(--w); height: var(--h); border-radius: 38px;
    overflow: hidden; background: var(--system-background);
    position: relative;
  }
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: var(--notch-w); height: var(--notch-h);
    background: #000;
    border-radius: 0 0 var(--notch-r) var(--notch-r);
    z-index: 210;
    display: flex; align-items: center; justify-content: center;
    gap: 64px; padding-bottom: 6px; pointer-events: none;
  }
  .notch .speaker {
    width: 50px; height: 5px; border-radius: 3px;
    background: #141418;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), inset 0 -1px 1px rgba(0,0,0,0.7);
  }
  .notch .camera {
    width: 11px; height: 11px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #0d0d20 0%, #05050a 60%, #000 100%);
    box-shadow: inset 0 1px 2px rgba(80,120,255,0.35);
  }
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px 0; font-size: 15px; font-weight: 600;
    font-variant-numeric: tabular-nums; color: #fff; letter-spacing: -0.3px;
    pointer-events: none;
  }
  .status-right { display: flex; align-items: center; gap: 5px; }
  .nav-bar {
    position: absolute; top: 54px; left: 0; right: 0; height: 44px; z-index: 80;
    display: none; align-items: center; padding: 0 16px;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 0.5px solid var(--separator);
    color: var(--system-blue); font-size: 17px; letter-spacing: -0.41px;
  }
  .nav-bar.shown { display: flex; }
  .nav-bar .back {
    display: flex; align-items: center; gap: 4px; cursor: pointer;
  }
  .nav-bar .back::before {
    content: ""; width: 10px; height: 10px;
    border-left: 2px solid var(--system-blue);
    border-bottom: 2px solid var(--system-blue);
    transform: rotate(45deg); border-radius: 1px;
    margin-right: 4px; margin-top: -2px;
  }
  .nav-bar .title {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 17px; font-weight: 600; letter-spacing: -0.41px;
    color: var(--label); white-space: nowrap;
  }
  .content {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding-top: 54px; padding-bottom: 32px;
    scrollbar-width: none; color: var(--label); z-index: 10;
  }
  .content::-webkit-scrollbar { display: none; }
  .content.has-nav { padding-top: 98px; }

  .large-title {
    padding: 20px 20px 4px;
    font-size: 34px; font-weight: 700; letter-spacing: 0.37px;
    color: var(--label); line-height: 41px;
  }
  .search-wrap { padding: 8px 20px 14px; }
  .search {
    display: flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 8px;
    background: var(--card-bg); border-radius: 10px;
    color: var(--secondary-label); font-size: 17px; letter-spacing: -0.41px;
  }
  .search svg { opacity: 0.55; flex-shrink: 0; }

  /* ============================================================
     GROUPED CAPSULE CARD — the Apple iOS 27 design element
     A whole category of rows is wrapped in one rounded container
     with 26px corner radius. This is what Apple calls an
     "inset grouped list" but visually it is a floating capsule.
     ============================================================ */
  .section { margin: 0 12px 24px; }

  .section-header {
    font-size: 13px; letter-spacing: -0.08px;
    color: var(--secondary-label);
    padding: 0 20px 8px;
    text-transform: uppercase;
    font-weight: 400;
  }
  .section-footer {
    font-size: 13px; letter-spacing: -0.08px;
    color: var(--secondary-label);
    padding: 10px 20px 0; line-height: 18px;
  }

  /* The capsule container that holds the whole category */
  .capsule {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    overflow: hidden;
    position: relative;
    /* Subtle inner highlight for the Liquid Glass look */
    box-shadow:
      inset 0 0.5px 0 rgba(255,255,255,0.06),
      0 2px 12px rgba(0,0,0,0.35);
  }

  /* Rows inside the capsule — first row has rounded top, last row rounded bottom */
  .row {
    position: relative;
    display: flex; align-items: center;
    min-height: 44px;
    padding: 11px 16px;
    cursor: pointer; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.05s;
  }
  .row:active { background: rgba(255,255,255,0.06); }
  .row.two-line { min-height: 52px; padding: 8px 16px; }

  /* iOS 27 divider: inset from left, hugs only inner rows */
  .row + .row::before {
    content: ""; position: absolute;
    top: 0; left: 57px; right: 0; height: 0.5px;
    background: var(--separator);
  }
  .row.no-icon + .row::before { left: 16px; }

  .icon-sq {
    width: 29px; height: 29px; border-radius: 6.5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-sq svg { width: 18px; height: 18px; display: block; }
  .icon-sq.avatar {
    width: 60px; height: 60px; border-radius: 30px;
    background: linear-gradient(135deg, #4285F4, #EA4335, #FBBC04, #34A853);
    font-size: 24px; font-weight: 700; color: #fff; margin-right: 12px;
  }
  .row-main {
    flex: 1; min-width: 0; margin-left: 12px;
    display: flex; flex-direction: column;
  }
  .row.no-icon .row-main { margin-left: 0; }
  .row-title {
    font-size: 17px; letter-spacing: -0.41px;
    color: var(--label); line-height: 22px;
  }
  .row-title.destructive { color: var(--system-red); }
  .row-sub {
    font-size: 13px; letter-spacing: -0.08px;
    color: var(--secondary-label); line-height: 18px; margin-top: 1px;
  }
  .row-value {
    font-size: 17px; letter-spacing: -0.41px;
    color: var(--secondary-label); margin-left: 8px; flex-shrink: 0;
  }
  .chevron {
    width: 8px; height: 8px;
    border-top: 2px solid var(--tertiary-label);
    border-right: 2px solid var(--tertiary-label);
    transform: rotate(45deg);
    margin-left: 8px; margin-right: 4px;
    flex-shrink: 0; border-radius: 1px;
  }
  .toggle {
    width: 51px; height: 31px; border-radius: 15.5px;
    background: var(--system-gray4); position: relative;
    flex-shrink: 0; margin-left: 8px;
    transition: background 0.25s; cursor: pointer;
  }
  .toggle.on { background: var(--system-green); }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 13.5px;
    background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.16);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .toggle.on::after { transform: translateX(20px); }
  .slider-row { padding: 12px 16px 14px; }
  .slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px;
    background: var(--system-gray4); outline: none; margin-top: 8px;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    cursor: pointer;
  }
  .slider::-moz-range-thumb {
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; border: none; cursor: pointer;
  }
  .home-indicator {
    position: absolute; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    background: #fff; opacity: 0.9; border-radius: 3px;
    z-index: 95; pointer-events: none;
  }
  .backend-panel {
    max-width: 680px; width: 100%;
    background: #0a1a0a; border: 1px solid #1a3a1a;
    border-radius: 12px; padding: 16px 20px;
    font-size: 12px; line-height: 1.8;
    color: #4ade80; font-family: ui-monospace, Menlo, monospace;
    display: none;
  }
  .backend-panel h3 {
    font-size: 13px; font-weight: 700;
    color: #86efac; margin-bottom: 10px; text-transform: uppercase;
  }
  .backend-panel table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .backend-panel td { padding: 3px 0; vertical-align: top; }
  .backend-panel td:first-child { color: #6b8f6b; width: 46%; padding-right: 12px; }
  .backend-panel td:last-child { color: #bbf7d0; }
</style>
</head>

/* Exact iOS 27.0.1 Settings tree — root level below.

   Face ID, Emergency SOS, Privacy, Game Center, iCloud, Wallet, Apps, Reset,
   About, Software Update, Storage, Account) follow the same capsule schema:
   sections of rows with header/footer, radio/slider/toggle/value accessories.
   See the board file on disk for the complete navigable tree. */
const TREE = {
  root: { title: 'Settings', parent: null, sections: [
    { rows: [{ title: 'Alex Chen', sub: 'Apple Account, iCloud, Find My', avatar: 'A', nav: 'account' }]},

    { rows: [
      { title: 'Airplane Mode', icon: 'airplane', color: 'system-orange', toggle: true, on: false },
      { title: 'Wi-Fi', icon: 'wifi', color: 'system-blue', value: 'HomeWiFi', nav: 'wifi' },

    ]},

/* AOSP 16 backend map for the root rows above.
   Verified against frameworks/base in this tree except where noted:
   - QuickShareService: NO AOSP class — Quick Share row fires ACTION_SEND
     (Bluetooth/nearby targets), transport is Bluetooth on AOSP.
   - Siri/VoiceInteractionService: AOSP has the service API; the assistant
     itself is GMS. Row renamed "Voice input".
   - StandBy/DreamService: DreamService IS the AOSP equivalent. Renamed.
   - Game Center/iCloud/Wallet&Apple Pay: no AOSP equivalents (Play
     Games/Drive/Wallet are GMS). Rows renamed or omitted in the native app.
   - AirplaneModeEnabler.setAirplaneMode() lives in stock Settings and needs
     WRITE_SECURE_SETTINGS; a debug-signed app navigates instead.
   - setDataEnabled() is deprecated; use setDataEnabledForReason(REASON_USER).
   - wipeData()/resetPassword() need device/profile owner; reset rows omitted.
   - RenderEffect.createBlurEffect() blurs a window's OWN content, never what
     is behind it; real frost needs FLAG_BLUR_BEHIND (API 31+). */
const BACKENDS = [
  ['Airplane Mode', 'AirplaneModeEnabler', 'setAirplaneMode() — stock Settings, privileged; third-party rows navigate to ACTION_WIRELESS_SETTINGS'],
  ['Wi-Fi', 'WifiManager', 'setWifiEnabled() · connect()'],
  ['Bluetooth', 'BluetoothAdapter', 'enable() · connectGatt()'],
  ['Cellular', 'TelephonyManager', 'setDataEnabledForReason(REASON_USER) · setDataRoamingEnabled()'],
  ['Personal Hotspot', 'WifiManager', 'startSoftAp() · stopSoftAp()'],
  ['Quick Share', 'ACTION_SEND chooser', 'Bluetooth/nearby targets — no proprietary P2P on AOSP'],
  ['Battery', 'BatteryManager', 'BATTERY_PROPERTY_CAPACITY'],
  ['About', 'Build', 'MODEL · VERSION.RELEASE'],
  ['Software Update', 'UpdateEngine', 'applyPayload() · checkForUpdate()'],
  ['Storage', 'StorageManager', 'getAllocatableBytes()'],
  ['Date & Time', 'AlarmManager', 'setTime() · setTimeZone()'],
  ['Keyboard', 'InputMethodManager', 'showInputMethodPicker()'],
  ['Language', 'LocaleManager', 'setApplicationLocales()'],
  ['Accessibility', 'AccessibilityManager', 'getEnabledAccessibilityServiceList()'],
  ['Appearance', 'UiModeManager + Configuration', 'setNightMode() · fontScale'],
  ['Camera', 'CameraManager', 'Camera2 API · CameraCharacteristics'],
  ['Control Center', 'QSCustomizer', 'QSTileHost · TileService'],
  ['Display', 'DisplayManager', 'setBrightness() · getSupportedModes()'],
  ['Night Shift', 'NightDisplayManager', 'setActivated() · setColorTemperature()'],
  ['Home Screen', 'Launcher3', 'Workspace · Hotseat · Folder'],
  ['Voice input', 'VoiceInteractionService', 'assistant itself is GMS; settings page is AOSP'],
  ['Screen saver', 'DreamService', 'the AOSP equivalent of StandBy'],
  ['Wallpaper', 'WallpaperManager', 'setBitmap() · live-wallpaper chooser'],
  ['Notifications', 'NotificationManager', 'setZenMode() · getActiveNotifications()'],
  ['Sounds', 'AudioManager', 'adjustStreamVolume() · setStreamVolume()'],
  ['Focus', 'NotificationManager', 'setZenMode(MODE_IMPORTANT_INTERRUPTIONS)'],
  ['Screen Time', 'UsageStatsManager', 'queryUsageStats()'],
  ['Face unlock', 'FaceManager', 'enroll() · authenticate() · remove()'],
  ['Fingerprint', 'FingerprintManager', 'enroll() · authenticate() · remove()'],
  ['Passcode', 'KeyguardManager', 'createConfirmDeviceCredentialIntent()'],
  ['Emergency SOS', 'EmergencyAffordanceManager', 'emergencyCall()'],
  ['Privacy', 'AppOpsManager', 'checkOp() · setMode()'],
  ['Location', 'LocationManager', 'isProviderEnabled()'],
  ['NFC & payments', 'NfcAdapter', 'enable() · enableReaderMode()'],
  ['Apps', 'PackageManager', 'getInstalledApplications()'],
  ['Power', 'GlobalActionsDialog', 'PowerManager.shutdown() · reboot() — privileged; no settings row invokes it']
];

const elContent = document.getElementById('content');
const elNavBar = document.getElementById('nav-bar');
const elNavBack = document.getElementById('nav-back');
const elNavTitle = document.getElementById('nav-title');

function colorVar(c) { return c ? `var(--${c})` : 'var(--system-blue)'; }

function rowHTML(row) {
  const isTwoLine = row.sub ? 'two-line' : '';
  const isNoIcon = (!row.icon && !row.avatar) ? 'no-icon' : '';
  const destCls = row.destructive ? ' destructive' : '';

  let iconHTML = '';
  if (row.avatar) {
    iconHTML = `<div class="icon-sq avatar">${row.avatar}</div>`;
  } else if (row.icon && I[row.icon]) {
    iconHTML = `<div class="icon-sq" style="background:${colorVar(row.color)}"><svg viewBox="0 0 18 18">${I[row.icon]}</svg></div>`;
  }

  let rightHTML = '';
  if (row.toggle) {
    rightHTML = `<div class="toggle${row.on ? ' on' : ''}" data-toggle></div>`;
  } else if (row.radio) {
    rightHTML = row.on
      ? `<div style="color:var(--system-blue);margin-left:8px;"><svg viewBox="0 0 18 18" width="18" height="18"><path d="M4 9.5l3.5 3.5 6.5-7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>`
      : `<div style="width:18px;height:18px;margin-left:8px;"></div>`;
  } else if (row.value !== undefined && row.value !== null && row.value !== '') {
    rightHTML = `<div class="row-value">${row.value}</div>`;
    if (row.nav || row.icon === undefined) rightHTML += `<div class="chevron"></div>`;
  } else if (row.nav) {
    rightHTML = `<div class="chevron"></div>`;
  } else if (!row.toggle && !row.radio && row.destructive === undefined) {
    rightHTML = `<div class="chevron"></div>`;
  }

  const dataNav = row.nav ? ` data-nav="${row.nav}"` : '';
  return `<div class="row ${isTwoLine} ${isNoIcon}"${dataNav}>
    ${iconHTML}
    <div class="row-main">
      <div class="row-title${destCls}">${row.title}</div>
      ${row.sub ? `<div class="row-sub">${row.sub}</div>` : ''}
    </div>
    ${rightHTML}
  </div>`;
}

function renderScreen(key) {
  const s = TREE[key];
  if (!s) return { html: `<div style="padding:100px 20px;color:#888;text-align:center;">Screen not found: ${key}</div>`, title: '', parent: null, isRoot: false };

  let html = '';
  const isRoot = key === 'root';

  if (isRoot) {
    html += `<div class="large-title">Settings</div>`;
    html += `<div class="search-wrap"><div class="search">
      <svg width="15" height="15" viewBox="0 0 18 18"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 12l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Search</span>
    </div></div>`;
  }

  s.sections.forEach(sec => {
    html += `<div class="section">`;
    if (sec.header) html += `<div class="section-header">${sec.header}</div>`;
    if (sec.rows) {
      html += `<div class="capsule">`;
      sec.rows.forEach(r => { html += rowHTML(r); });
      html += `</div>`;
    }
    if (sec.chart) {
      html += `<div class="capsule" style="padding:16px;"><div style="display:flex;align-items:flex-end;gap:4px;height:80px;">`;
      [45,62,78,55,90,70,35,50].forEach(h => {
        html += `<div style="flex:1;background:var(--system-green);height:${h}%;border-radius:2px;"></div>`;
      });
      html += `</div></div>`;
    }
    if (sec.footer) html += `<div class="section-footer">${sec.footer}</div>`;
    html += `</div>`;
  });

  html += `<div style="height:32px"></div>`;
  return { html, title: s.title, parent: s.parent, isRoot };
}

function showScreen(key) {
  const { html, title, parent, isRoot } = renderScreen(key);

  if (isRoot) {
    elNavBar.classList.remove('shown');
    elContent.classList.remove('has-nav');
  } else {
    elNavBar.classList.add('shown');
    elContent.classList.add('has-nav');
    elNavTitle.textContent = title;
    elNavBack.dataset.nav = parent || 'root';
  }

  elContent.innerHTML = html;
  elContent.scrollTop = 0;

  elContent.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      showScreen(el.dataset.nav);
    });
  });

  elContent.querySelectorAll('.toggle').forEach(t => {
    t.addEventListener('click', (e) => {
      e.stopPropagation();
      t.classList.toggle('on');
    });
  });
}

elNavBack.addEventListener('click', () => showScreen(elNavBack.dataset.nav || 'root'));
document.getElementById('btn-home').addEventListener('click', () => showScreen('root'));

    root.style.setProperty('--system-blue', '#0A84FF');
    root.style.setProperty('--system-green', '#30D158');
    root.style.setProperty('--system-red', '#FF453A');
    root.style.setProperty('--system-orange', '#FF9F0A');
    root.style.setProperty('--system-pink', '#FF375F');
    root.style.setProperty('--system-teal', '#64D2FF');
    root.style.setProperty('--system-indigo', '#5E5CE6');
    root.style.setProperty('--system-gray4', '#3A3A3C');
    btnDark.classList.add('active');
    btnLight.classList.remove('active');

    root.style.setProperty('--separator', 'rgba(60,60,67,0.36)');
    root.style.setProperty('--system-blue', '#007AFF');
    root.style.setProperty('--system-green', '#34C759');
    root.style.setProperty('--system-red', '#FF3B30');
    root.style.setProperty('--system-orange', '#FF9500');
    root.style.setProperty('--system-pink', '#FF2D55');
    root.style.setProperty('--system-teal', '#5AC8FA');
    root.style.setProperty('--system-indigo', '#5856D6');
    root.style.setProperty('--system-gray4', '#D1D1D6');
    btnLight.classList.add('active');
    btnDark.classList.remove('active');
    elNavBar.style.background = 'rgba(242,242,247,0.72)';
  }
}
btnLight.addEventListener('click', () => applyTheme(false));
btnDark.addEventListener('click', () => applyTheme(true));

function tick() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}`;
}
tick();
setInterval(tick, 10000);

showScreen('root');
</script>
